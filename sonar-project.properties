# S6549 (path-traversal oracle) FALSE POSITIVE exclusion for core/safe_paths.py.
# safe_paths.py IS the OWASP containment boundary: every caller (media_probe.probe_video,
# engine voiceover-regen) passes a pipeline-internal job-owned path (composed video /
# voiceover output / asset-cache) — never HTTP/end-user input (Flask surface ingests only
# topic/niche/job_id, none reach these functions). Path.relative_to(base) containment is
# enforced on every branch (relative-primary, CWD-fallback, absolute) and .resolve()
# follows symlinks, so parent traversal + symlink escape are both defeated.
# `# NOSONAR` cannot suppress this finding because S6549 is a TAINT-analysis rule (NOSONAR
# only suppresses static rules — empirically confirmed on PR #95). A project-level issue
# exclusion is the documented remedy for a confirmed taint FP. Verified non-FP: if a future
# caller passes genuinely user-controlled input to resolve_existing_file_under, REMOVE this
# exclusion so S6549 re-arms.
sonar.issue.ignore.multicriteria=s6549_safe_paths
sonar.issue.ignore.multicriteria.s6549_safe_paths.ruleKey=pythonsecurity:S6549
sonar.issue.ignore.multicriteria.s6549_safe_paths.resourceKey=**/safe_paths.py
